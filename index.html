<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Demeure, 2017 – 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@500;600&display=swap">
<style>
/* Même habillage que le diaporama de la longère : fond sombre fixe, photos et dates seulement.
   Trois classements : 1. mêmes angles de vue (une planche par pièce, une rangée par point de vue),
   2. chronologie complète (avant, incendie, travaux, après), 3. toutes les photos pièce par pièce.
   Les plans ouvrent la page : avant et après côte à côte, puis superposés. */
:root{
  --bg:#12100d;
  --ink:#f1ebe0;
  --muted:#a59c8c;
  --gold:#d2a957;
  --panel:rgba(18,16,13,.72);
  --line:rgba(241,235,224,.16);
  --avant:#b7c3d6;
  --incendie:#ee7a4f;
  --apres:#9fcf8f;
  --display:"DM Serif Display", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- accueil ---------- */
#home{height:100%;overflow-y:auto}
.wrap{max-width:1180px;margin:0 auto;padding:40px 20px 72px;display:flex;flex-direction:column;gap:34px}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,6vw,76px);line-height:1.02;margin:0;text-wrap:balance}
.head .rule{width:72px;height:2px;background:var(--gold);margin:22px 0 16px}
.head p{margin:0;font-size:clamp(17px,2vw,24px);letter-spacing:.14em;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.feature{position:relative;display:block;width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#1b1813;padding:0;cursor:pointer;text-align:left;min-height:220px}
.feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.feature .txt{position:relative;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-height:220px;padding:26px 28px;background:linear-gradient(0deg,rgba(18,16,13,.92),rgba(18,16,13,.15))}
.feature .t{font-family:var(--display);font-size:clamp(28px,4vw,46px);line-height:1.05}
.feature .m,.tile .m{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.feature:hover,.tile:hover{border-color:var(--gold)}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-family:var(--body);font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;text-align:left;padding:0;background:#1b1813;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.tile .cv{position:relative;width:100%;aspect-ratio:4/3;background:#221e17;overflow:hidden;flex:none}
.tile .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tx{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px}
.tile .t{font-family:var(--display);font-size:22px;line-height:1.12;text-wrap:balance}
.tile .s{font-size:14px;color:var(--muted);line-height:1.35}
.tile .m{font-size:12.5px}

/* ---------- lecteur ---------- */
#player{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.piece{position:absolute;top:14px;left:20px;right:20px;height:30px;line-height:30px;font-family:var(--display);font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.piece .ps{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em;padding-left:16px}
.media{position:absolute;inset:52px 16px 72px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.media .ph{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.media img{max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block}
.cap{flex:none;height:38px;line-height:38px;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.cap b{color:var(--gold);font-weight:600}
.cap i{font-style:normal;color:var(--muted);padding:0 .5em}
#bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;z-index:5;transition:opacity .4s}
#bar button,#bar select{font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:38px;padding:0 14px;cursor:pointer}
#bar button:hover,#bar select:hover{border-color:var(--gold)}
#play.playing,#nums[aria-pressed="true"]{background:var(--gold);color:#1b160d;border-color:var(--gold);font-weight:600}
#count{margin-left:auto;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
#goto{width:58px;height:38px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
#goto:hover,#goto:focus{border-color:var(--gold);outline:none}
#jump{max-width:150px}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0;z-index:6;transition:width .4s ease}
.nav{position:absolute;top:0;bottom:64px;width:18%;z-index:4;cursor:pointer;background:none;border:0}
#navL{left:0}#navR{right:0}
.lbl2{font-size:14px;color:var(--muted)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:17px;color:var(--muted);z-index:2;pointer-events:none}
body.idle #bar{opacity:0}
body.idle #player{cursor:none}

/* ---------- moments clés : plein cadre, grande date ---------- */
.punch .slide{transition:opacity .45s ease}
.punch .piece{display:none}
.punch .media{inset:0 0 0 0}
.punch .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.38);transform:scale(1.1)}
.punch .media img{border-radius:0;box-shadow:none;max-height:100%}
.punch .slide.on .media img{animation:kb 7s linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.punch .cap{position:absolute;left:28px;bottom:74px;height:auto;line-height:1.05;font-family:var(--display);font-weight:400;font-size:clamp(26px,4.6vw,60px);letter-spacing:0;text-transform:none;text-shadow:0 2px 18px rgba(0,0,0,.75);z-index:3}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{display:flex;align-items:center;justify-content:center;padding:24px}
.card span{font-family:var(--display);font-size:clamp(54px,13vw,190px);line-height:1;color:var(--gold);text-align:center;text-wrap:balance;font-variant-numeric:tabular-nums}

/* ---------- planches : rangées de photos prises du même angle ---------- */
.boards .media{inset:52px 44px 72px 44px;gap:12px}
.boards .nav{width:36px;color:var(--muted);font-size:26px;display:flex;align-items:center;justify-content:center;opacity:.55}
.boards .nav:hover{opacity:1;color:var(--gold)}
.boards #navL::before{content:"‹"}
.boards #navR::before{content:"›"}
.brow{display:flex;flex-direction:column;align-items:stretch;flex:none}
.rl{height:24px;line-height:22px;font-size:13.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl::before{content:"";display:inline-block;width:18px;height:2px;background:var(--gold);vertical-align:middle;margin-right:10px}
.row3{display:flex;justify-content:center;align-items:flex-start;gap:14px}
.row3.col{flex-direction:column;align-items:center;gap:6px}
.row3.col .cap{white-space:nowrap;overflow:visible}
.row3 figure{margin:0;display:flex;flex-direction:column;align-items:center;flex:none}
.boards .media .row3 img{display:block;width:100%;max-width:none;max-height:none;object-fit:cover;cursor:zoom-in;background:#1b1813}
.boards .cap{height:34px;line-height:34px;font-size:13.5px;letter-spacing:.1em}
.cap .num{color:var(--muted);font-weight:500;display:none}
body.nums .cap .num{display:inline}
.s-avant b{color:var(--avant)}
.s-incendie b{color:var(--incendie)}
.s-travaux b{color:var(--gold)}
.s-apres b{color:var(--apres)}
figure.narrow .cap{align-self:stretch;white-space:normal;line-height:15px;padding-top:3px;font-size:12px;letter-spacing:.06em;text-align:center;overflow:hidden}
figure.narrow .cap i{padding:0 .3em}
#nums{display:none}
.boards #nums{display:inline-block}

/* ---------- accueil : les trois classements ---------- */
.features.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.features.one{grid-template-columns:1fr}
.features.one .feature{min-height:190px}
.features.two .feature,.features.two .feature .txt{min-height:170px}
.features.three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.feature .n{font-family:var(--display);font-size:56px;line-height:.9;color:var(--gold)}
.featbox{display:flex;flex-direction:column;gap:8px}
.featbox .feature{flex:1 1 auto}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:#1b1813;border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer;text-align:left;min-width:0}
.chip:hover{border-color:var(--gold)}
.chip b{font-size:14px;font-weight:600;white-space:nowrap}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile{cursor:default}
.tile .act{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tile .act button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.tile .act button:hover{border-color:var(--gold);color:var(--gold)}
.tile .act i{font-style:normal;color:var(--muted);padding-left:7px;font-variant-numeric:tabular-nums}
.card{flex-direction:column;gap:20px}
.card small{font-size:clamp(14px,1.9vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.boards .card span{font-size:clamp(34px,6.4vw,92px);max-width:18ch}

/* ---------- plans superposés : un trait à glisser ---------- */
.cmp{position:relative;flex:none;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.media .cmp img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;border-radius:0;box-shadow:none}
.cmp .cb{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.cmp .cb::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1b160d;font-size:20px;font-weight:600;line-height:43px;text-align:center;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.cmp .cl{position:absolute;bottom:10px;padding:5px 12px;border-radius:999px;background:rgba(18,16,13,.88);font-size:13.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .2s}
.cmp .cl.a{left:10px}
.cmp .cl.b{right:10px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none}
.cmp:focus-within .cb{background:#fff}

.piece .pn{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-right:14px;white-space:nowrap}
/* ---------- calques : les photos d'un même point de vue, l'une sur l'autre ---------- */
.stkw{display:flex;flex-direction:column;align-items:center;gap:8px}
.stk{position:relative;flex:none;overflow:hidden;border-radius:3px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.stk .ly{position:absolute;inset:0;display:none;overflow:hidden}
.stk .ly.on{display:block}
.stk .ly.top{z-index:2}
.stk .lb{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(24px) brightness(.45)}
.media .stk .ly img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;border-radius:0;box-shadow:none;pointer-events:none}
.stk .cb{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;z-index:3}
.stk .cb::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1b160d;font-size:20px;font-weight:600;line-height:43px;text-align:center;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.stk .zb{position:absolute;top:10px;left:10px;z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(18,16,13,.8);font-size:18px;cursor:pointer;padding:0}
.lc{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.lc button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;opacity:.5}
.lc button.on{opacity:1;border-color:currentColor}
.lc button b{font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lc .num{display:none}
body.nums .lc .num{display:inline}
#lay[aria-pressed="true"]{background:var(--gold);color:#1b160d;border-color:var(--gold)}

/* ---------- agrandissement d'une photo ---------- */
#zoom{position:fixed;inset:0;z-index:20;background:rgba(10,9,7,.97);display:flex;flex-direction:column;align-items:stretch;padding:14px 14px 4px;touch-action:none;overscroll-behavior:contain}
#zw{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-out}
#zoom img{flex:none;max-width:none;max-height:none;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.6);cursor:zoom-in;transform-origin:50% 50%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#zoom.zoomed img{cursor:grab;border-radius:0;box-shadow:none}
#zoom .cap{flex:none;height:44px;line-height:44px;text-align:center}
.zbar{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:8px}
.zbar button{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(27,24,19,.92);font-size:22px;line-height:1;cursor:pointer}
.zbar button:hover{border-color:var(--gold);color:var(--gold)}
.zhint{position:absolute;left:16px;bottom:14px;font-size:12.5px;color:var(--muted);pointer-events:none}
@media (max-width:900px){.zhint{display:none}}

.hidden{display:none !important}
@media (max-width:640px){
  .wrap{padding:26px 14px 60px;gap:26px}
  .piece{top:8px;left:10px;font-size:19px;height:26px;line-height:26px}
  .piece .ps{display:none}
  .media{inset:38px 8px 68px 8px}
  .boards .media{inset:38px 8px 68px 8px;gap:6px}
  .boards .nav{display:none}
  .cap,.boards .cap{height:28px;line-height:28px;font-size:12px}
  #bar{gap:6px;padding:0 10px}
  #bar button,#bar select{padding:0 9px;font-size:14px}
  .lbl,.lbl2{display:none}
  .punch .cap{left:14px;bottom:72px}
}
@media (max-width:700px){
  #bar{height:auto;min-height:64px;flex-wrap:wrap;row-gap:6px;padding:8px 10px 10px}
  #fs{display:none}
  #jump{max-width:128px}
  #goto{width:50px;height:36px}
  .media,.boards .media{bottom:112px}
  .punch .cap{bottom:116px}
}
@media (prefers-reduced-motion:reduce){.slide,.punch .slide{transition:none}.punch .slide.on .media img{animation:none}}
</style>
</head>
<body>
<div id="home">
  <div class="wrap">
    <header class="head">
      <h1>La Demeure</h1>
      <div class="rule"></div>
      <p>2017 – 2026</p>
    </header>
    <div id="homeBody" style="display:flex;flex-direction:column;gap:34px"></div>
  </div>
</div>

<div id="player" class="hidden">
  <div id="stage"></div>
  <div id="msg" class="hidden"></div>
  <button class="nav" id="navL" aria-label="Précédente"></button>
  <button class="nav" id="navR" aria-label="Suivante"></button>
  <div id="bar">
    <button id="back" aria-label="Revenir à l'accueil">☰ <span class="lbl">Accueil</span></button>
    <button id="prev" aria-label="Précédente">‹</button>
    <button id="play" aria-label="Lecture automatique">▶ <span class="lbl">Défilement auto</span></button>
    <button id="next" aria-label="Suivante">›</button>
    <label for="speed" class="lbl2">Durée</label>
    <select id="speed" aria-label="Durée d'affichage">
      <option value="2">2 s</option>
      <option value="3">3 s</option>
      <option value="5" selected>5 s</option>
      <option value="8">8 s</option>
      <option value="12">12 s</option>
    </select>
    <button id="fs" aria-label="Plein écran">⛶ <span class="lbl">Plein écran</span></button>
    <select id="jump" aria-label="Aller à une partie du diaporama"></select>
    <button id="nums" aria-pressed="false" aria-label="Afficher les numéros des photos">N° <span class="lbl">des photos</span></button>
    <button id="lay" class="hidden" aria-pressed="false" aria-label="Superposer les photos d'un même point de vue">◧ <span class="lbl">Calques</span></button>
    <span id="count"><span class="lbl" id="countlbl">Vue</span> <input id="goto" type="text" inputmode="numeric" autocomplete="off" aria-label="Numéro de la vue : tapez un numéro pour y aller"> <span id="total"></span></span>
  </div>
  <div id="prog"></div>
</div>

<div id="zoom" class="hidden" role="dialog" aria-label="Photo agrandie">
  <div class="zbar"><button id="zminus" type="button" aria-label="Réduire">−</button><button id="zplus" type="button" aria-label="Agrandir">+</button><button id="zclose" type="button" aria-label="Fermer">✕</button></div>
  <div id="zw"><img id="zimg" alt="" draggable="false"></div>
  <div class="cap" id="zcap"></div>
  <div class="zhint">Clic sur la photo : loupe · molette ou deux doigts : zoom · glisser pour se déplacer</div>
</div>

/* Les photos arrivent par petits paquets (une pièce, une période). On ne garde en mémoire que les derniers. */
const packs = {}, packOrder = [];
function loadPack(file){
  const i = packOrder.indexOf(file); if(i >= 0) packOrder.splice(i, 1);
  packOrder.push(file);
  if(!packs[file]){
    packs[file] = fetch(file).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(list){
      const m = {}; list.forEach(function(x){ m[x.id] = x.b; }); return m;
    });
    packs[file].catch(function(){ delete packs[file]; });
  }
  while(packOrder.length > 12){ delete packs[packOrder.shift()]; }
  return packs[file];
}
function loadPacks(files){
  return Promise.all((files || []).map(loadPack)).then(function(maps){
    return function(id){ for(let i = 0; i < maps.length; i++){ if(maps[i][id]) return maps[i][id]; } return null; };
  });
}
function urlFor(get, id){
  if(urls[id]) return urls[id];
  const b = get(id); if(!b) return '';
  const bin = atob(b); const n = bin.length; const u8 = new Uint8Array(n);
  for(let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  urls[id] = URL.createObjectURL(new Blob([u8], {type:'image/jpeg'}));
  return urls[id];
}
function clearUrls(){ Object.keys(urls).forEach(function(k){ URL.revokeObjectURL(urls[k]); }); urls = {}; }

  zp.set(e.pointerId, [e.clientX, e.clientY]);
  if(zp.size === 1){ zmoved = 0; zmulti = false; zstart = [e.clientX, e.clientY, zx, zy]; }
  else if(zp.size === 2){ zmulti = true; const a = Array.from(zp.values()); zpinch = {d:Math.max(1, zdist(a[0], a[1])), s:zs}; }
});
zw.addEventListener('pointermove', function(e){
  if(!zp.has(e.pointerId)) return;
  zp.set(e.pointerId, [e.clientX, e.clientY]);
  if(zp.size === 2 && zpinch){
    const a = Array.from(zp.values()), r = zw.getBoundingClientRect();
    zto(zpinch.s * zdist(a[0], a[1]) / zpinch.d, (a[0][0] + a[1][0]) / 2 - r.left - r.width / 2, (a[0][1] + a[1][1]) / 2 - r.top - r.height / 2);
  }
  else if(zp.size === 1 && zstart){
    const dx = e.clientX - zstart[0], dy = e.clientY - zstart[1];
    zmoved = Math.max(zmoved, Math.abs(dx) + Math.abs(dy));
    if(zs > 1.01){ zx = zstart[2] + dx; zy = zstart[3] + dy; zapply(); }
  }
});
function zup(e){
  if(!zp.has(e.pointerId)) return;
  zp.delete(e.pointerId);
  if(zp.size < 2) zpinch = null;
  if(zp.size === 1){ const a = Array.from(zp.values())[0]; zstart = [a[0], a[1], zx, zy]; }
  if(zp.size === 0 && !zmulti && zmoved < 8 && e.type === 'pointerup'){
    if(document.elementFromPoint(e.clientX, e.clientY) === zimg){
      const pt = zpoint(e);
      zimg.style.transition = 'transform .2s ease';
      if(zs > 1.01) zto(1, 0, 0); else zto(2.5, pt[0], pt[1]);
    }
    else unzoom();
  }
}
zw.addEventListener('pointerup', zup);
zw.addEventListener('pointercancel', zup);
zoom.addEventListener('wheel', function(e){
  e.preventDefault(); zimg.style.transition = '';
  const pt = zpoint(e); zto(zs * Math.exp(-e.deltaY * 0.0016), pt[0], pt[1]);
}, {passive:false});
zoom.addEventListener('click', function(e){ if(e.target === zoom || e.target.id === 'zcap') unzoom(); });
$('zplus').onclick = function(e){ e.stopPropagation(); zimg.style.transition = 'transform .2s ease'; zto(zs * 1.6, 0, 0); };
$('zminus').onclick = function(e){ e.stopPropagation(); zimg.style.transition = 'transform .2s ease'; zto(zs / 1.6, 0, 0); };
$('zclose').onclick = function(e){ e.stopPropagation(); unzoom(); };
window.addEventListener('resize', function(){ if(zList.length){ zfit(); zapply(); } });

/* ---------- navigation par l'adresse : #angles/hall, #chronologie/incendie, #pieces/spa, #plans… ---------- */
function go(h){ if(location.hash === '#' + h) route(); else location.hash = h; }
function route(){
  let k = decodeURIComponent(location.hash.replace(/^#/, ''));
  if(k === 'visite' || k === 'avant-incendie-apres') k = 'angles';
  let parts = k.split('/');
  if(byKey[parts[0]] && byKey[parts[0]].all) parts = ['angles', parts[0]];   /* anciens liens #hall, #spa… */
  const d = byKey[parts[0]];
  if(!d || !d.slides){ if(show_) close(); return; }
  if(show_ !== d){
    rowsMode = !!d.boards && smallScreen();
    const sq = buildSeq(d);
    const i = !parts[1] ? resumeAt(d, sq.length) : /^\d+$/.test(parts[1]) ? +parts[1] - 1 : sq.findIndex(function(q){ return q.s.anchor === parts[1]; });
    open(d, Math.max(0, i));
  }
  else if(parts[1] && /^\d+$/.test(parts[1])){ if(+parts[1] - 1 !== cur) show(Math.max(0, Math.min(slides.length - 1, +parts[1] - 1))); }
  else if(parts[1] && (!seq[cur] || seq[cur].s.anchor !== parts[1])){
    const i = seq.findIndex(function(q){ return q.s.anchor === parts[1]; });
    if(i >= 0) show(i);
  }
}
window.addEventListener('hashchange', route);

function setNums(on){
  document.body.classList.toggle('nums', on); $('nums').setAttribute('aria-pressed', on ? 'true' : 'false');
  try{ localStorage.setItem('demeure-nums', on ? '1' : '0'); }catch(e){}
}
try{ if(localStorage.getItem('demeure-nums') !== '0') setNums(true); }catch(e){ document.body.classList.add('nums'); }

$('back').onclick = function(){ close(); try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; } };
$('play').onclick = function(){ playing ? stop() : play(); };
$('prev').onclick = function(){ advance(-1); };
$('next').onclick = function(){ advance(1); };
$('navL').onclick = function(){ advance(-1); };
$('navR').onclick = function(){ advance(1); };
$('lay').onclick = function(){
  layerMode = !layerMode; try{ localStorage.setItem('demeure-calques', layerMode ? '1' : '0'); }catch(e){}
  if(!show_) return;
  const bi = seq[cur] ? seq[cur].bi : 0, d = show_, was = playing;
  rowsMode = !!d.boards && smallScreen();
  open(d, Math.max(0, buildSeq(d).findIndex(function(q){ return q.bi === bi; }))); if(was) play();
};
$('speed').onchange = function(){ if(playing) schedule(); };
$('jump').onchange = function(){ const v = this.value; this.value = ''; this.blur(); if(v !== '') show(+v); };
$('goto').addEventListener('focus', function(){ stop(); this.select(); });
$('goto').addEventListener('change', function(){
  const n = parseInt(this.value, 10); this.blur();
  if(n >= 1 && slides.length) show(Math.min(slides.length, n) - 1); else count();
});
$('goto').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ this.blur(); } else if(e.key === 'Escape'){ this.value = String(cur + 1); this.blur(); } e.stopPropagation(); });
$('nums').onclick = function(){ setNums(!document.body.classList.contains('nums')); };
$('fs').onclick = function(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }catch(e){} };
document.addEventListener('keydown', function(e){
  if(!show_ || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if(zList.length){
    if(e.key === 'ArrowRight'){ zshow(zi + 1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ zshow(zi - 1); e.preventDefault(); }
    else if(e.key === '+' || e.key === '='){ zto(zs * 1.6, 0, 0); e.preventDefault(); }
    else if(e.key === '-'){ zto(zs / 1.6, 0, 0); e.preventDefault(); }
    else if(e.key === 'Escape' || e.key === ' ' || e.key === 'Enter'){ unzoom(); e.preventDefault(); }
    return;
  }
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ advance(1); e.preventDefault(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ advance(-1); e.preventDefault(); }
  else if(e.key === ' '){ playing ? stop() : play(); e.preventDefault(); }
  else if(e.key === 'Home'){ show(0); } else if(e.key === 'End'){ show(slides.length - 1); }
  else if(e.key === 'f' || e.key === 'F'){ $('fs').click(); }
  else if(e.key === 'Escape' && !document.fullscreenElement){ $('back').click(); }
});
let tx = null;
function swipe(node, fn){
  node.addEventListener('touchstart', function(e){ tx = (e.target.closest && e.target.closest('.cmp,.stk')) ? null : e.touches[0].clientX; }, {passive:true});
  node.addEventListener('touchend', function(e){ if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(dx) > 50) fn(dx < 0 ? 1 : -1, e); });
}
swipe(stage, function(dir){ show(cur + dir); });
swipe(zoom, function(dir, e){ if(zs > 1.01 || zmulti) return; e.preventDefault(); zshow(zi + dir); });
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ if(playing) document.body.classList.add('idle'); }, 2500); }
['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, wake, {passive:true}); });
route();
</script>
</body>
